[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-service-survival"
version = "1.3.0"
description = "Censoring-aware LEO service evaluation, decision integration, and prospective validation protocol"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "K. Deepak Chowdary" },
  { name = "Suvadip Hazra" },
  { name = "Rajendra Hegadi" },
]
dependencies = [
  "numpy==1.24.3",
  "pandas==2.0.3",
  "scipy==1.11.1",
  "scikit-learn==1.3.0",
  "matplotlib==3.7.2",
  "xgboost==3.1.2",
  "python-docx==1.2.0",
  "tabulate==0.8.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
